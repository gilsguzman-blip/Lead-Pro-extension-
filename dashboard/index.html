<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LeadPro Dashboard — Community Auto Group</title>
<!--
  v1.2 — EXPLICIT/IMPLICIT SPLIT. Every tile and column labelled 👍/👎 was rendering `ratings.up`
  and `ratings.down`, which cannot carry the distinction: the extension's _lpFeedbackDeriveRating
  returns 'up' for BOTH an explicit thumbs-up and a copied-as-is draft, and (since v9.7.540) 'down'
  for BOTH an explicit thumbs-down and an implicit regenerated-or-chipped-then-abandoned session.
  Only `signal` separates them. Confirmed live on 8/15: the daily report correctly showed 0 explicit
  👎 against 27 real down-ratings (all implicit_regen_no_copy / implicit_chip_no_copy), while this
  dashboard's tile read "EXPLICIT 👎: 27" and its per-store column read 16/4/4/2/1 — precisely
  ratings.down, per store.

  Nothing here needed a new computation. The proxy has emitted the split since v7.49 (top-level
  explicitUp / explicitDown / implicitUp) and v7.51 (per-bucket explicitDown / implicitDown), the
  latter's own header stating it exists "so a renderer's 👎 column can stop merging a thumbs-down
  with a regen-then-abandoned session". This is a field swap: ratings.down → explicitDown, with
  implicitDown disclosed alongside so nothing is hidden. Same defect and same fix as the reporter
  Worker's v1.8 (tiles) and v1.10 (per-store column).

  COMPATIBILITY: top-level implicitDown is new in proxy v7.53. Where it is absent the value is
  derived as ratings.down - explicitDown, so this page renders correctly against v7.49+ regardless
  of which proxy version is deployed. Per-bucket implicitDown has existed since v7.51.

  v1.1 — director-key patch (7/7/26).
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/recharts@2.12.7/umd/Recharts.min.js"></script>
<script>
  // Verify Recharts loaded correctly
  window.addEventListener('load', function() {
    if (!window.Recharts) {
      console.warn('Recharts failed to load from CDN — charts will be hidden');
    }
  });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:       #080c14;
    --surface:  #0e1320;
    --border:   #1a2235;
    --border2:  #111827;
    --text:     #e2e8f0;
    --muted:    #4b5563;
    --dim:      #94a3b8;
    --blue:     #3b82f6;
    --blue-dim: #1d4ed8;
    --green:    #34d399;
    --amber:    #fbbf24;
    --red:      #f87171;
    --mono:     'IBM Plex Mono', monospace;
    --sans:     'IBM Plex Sans', sans-serif;
  }
  html, body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }
  body { padding: 28px 20px; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  button { cursor: pointer; border: none; outline: none; font-family: var(--sans); }
  table { border-collapse: collapse; width: 100%; }

  /* Animations */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
  .fade-up { animation: fadeUp 0.4s ease both; }
  .fade-up-1 { animation-delay: 0.05s; }
  .fade-up-2 { animation-delay: 0.10s; }
  .fade-up-3 { animation-delay: 0.15s; }
  .fade-up-4 { animation-delay: 0.20s; }
  .fade-up-5 { animation-delay: 0.25s; }
  .loading-pulse { animation: pulse 1.4s ease infinite; }

  .wrap { max-width: 980px; margin: 0 auto; }

  /* Header */
  .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 28px; flex-wrap: wrap; gap: 16px; }
  .logo-line { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
  .logo { font-family: var(--mono); font-size: 26px; font-weight: 600; color: var(--blue); letter-spacing: -0.01em; }
  .logo span { color: var(--dim); font-weight: 400; }
  .sub { font-size: 12px; color: var(--muted); margin-top: 3px; }

  /* Range buttons */
  .range-btns { display: flex; gap: 6px; align-items: center; }
  .range-btn {
    padding: 7px 16px; border-radius: 6px; font-size: 12px; font-weight: 500;
    background: var(--surface); color: var(--dim); border: 1px solid var(--border);
    transition: all 0.15s;
  }
  .range-btn.active { background: var(--blue-dim); color: #fff; border-color: var(--blue); }
  .range-btn:hover:not(.active) { border-color: var(--blue); color: var(--text); }
  .refresh-btn {
    padding: 7px 11px; border-radius: 6px; font-size: 13px;
    background: var(--surface); color: var(--muted); border: 1px solid var(--border);
  }
  .refresh-time { font-size: 10px; color: #374151; text-align: right; margin-top: 4px; font-family: var(--mono); }

  /* Cards */
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
  .section-title {
    font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--blue); border-bottom: 1px solid var(--border2); padding-bottom: 9px; margin-bottom: 16px;
    font-family: var(--mono);
  }

  /* Stats grid */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 12px; }
  .stat { background: #090d16; border: 1px solid var(--border); border-radius: 8px; padding: 14px 16px; }
  .stat-label { font-size: 9px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 7px; font-family: var(--mono); }
  .stat-value { font-size: 26px; font-weight: 600; font-family: var(--mono); line-height: 1; }
  .stat-sub { font-size: 10px; color: var(--muted); margin-top: 5px; }

  /* Store bars */
  .store-row { margin-bottom: 13px; }
  .store-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
  .store-name { font-size: 12px; color: var(--text); }
  .store-stats { display: flex; gap: 14px; align-items: center; }
  .store-signals { font-size: 11px; color: var(--muted); font-family: var(--mono); }
  .store-rate { font-size: 13px; font-weight: 600; font-family: var(--mono); }
  .store-down { font-size: 11px; color: var(--red); }
  .store-nocopy { font-size: 11px; color: var(--amber); font-family: var(--mono); }
  .bar-bg { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.8s cubic-bezier(0.4,0,0.2,1); }

  /* Table */
  .tbl th { padding: 7px 10px; border-bottom: 1px solid var(--border2); color: var(--blue); font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; text-align: left; font-weight: 600; font-family: var(--mono); }
  .tbl td { padding: 8px 10px; border-bottom: 1px solid var(--border2); font-size: 12px; }
  .tbl tr:last-child td { border-bottom: none; }
  .tbl .right { text-align: right; }
  .mono { font-family: var(--mono); }

  /* Flag chips */
  .flag-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .flag-chip { background: #090d16; border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; min-width: 110px; }
  .flag-name { font-size: 10px; color: var(--dim); margin-bottom: 4px; font-family: var(--mono); }
  .flag-rate { font-size: 18px; font-weight: 600; font-family: var(--mono); line-height: 1; }
  .flag-meta { font-size: 10px; color: var(--muted); margin-top: 3px; }

  /* Two col layout */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  /* Error */
  .error-box { background: #1c0a0a; border: 1px solid #7f1d1d; border-radius: 8px; padding: 16px; margin-bottom: 20px; font-size: 13px; color: var(--red); }

  /* Show more */
  .show-more { font-size: 11px; color: var(--blue); background: none; padding: 8px 0 0; font-family: var(--sans); }
  .show-more:hover { text-decoration: underline; }

  /* Tooltip */
  .custom-tooltip { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 9px 13px; font-size: 12px; font-family: var(--mono); }
  .custom-tooltip .label { color: var(--dim); margin-bottom: 4px; font-size: 10px; }

  /* Disclosure line under the tiles */
  .disclosure { font-size: 10px; color: var(--muted); margin: -4px 0 20px; line-height: 1.6; }

  @media (max-width: 640px) {
    .stats-grid { grid-template-columns: 1fr 1fr; }
    .two-col { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script>
const { createElement: h, useState, useEffect, useCallback, Fragment } = React;
const RC = window.Recharts || {};
  const { LineChart, Line, BarChart, Bar, XAxis, YAxis, Tooltip, ResponsiveContainer, Cell } = RC;
  const chartsAvailable = !!window.Recharts;

const PROXY = 'https://leadpro-proxy.gilsguzman.workers.dev';
// (v1.1 — director-key patch, 7/7/26) The proxy's /feedback/* GET endpoints now require a
// director key (worker v7.30, W3). This dashboard is a static Pages site with no server side,
// so the key necessarily ships in this client-side source — same exposure class as it being
// visible in a URL bar. Acceptable for an internal, non-public dashboard; rotate this value
// (and the DIRECTOR_KEYS var on the worker) if this file or its deployed URL is ever shared
// outside the director/ownership group.
const DIRECTOR_KEY = 'LPDEV-GIL-DIRECTOR-001'; // ← replace with your current DIRECTOR_KEYS value

// (v1.2) EXPLICIT vs IMPLICIT — the whole point of this build.
// `rating` cannot carry the distinction. _lpFeedbackDeriveRating in the extension returns 'up'
// for an explicit thumbs-up AND for a copied-as-is draft, and 'down' for an explicit thumbs-down
// AND for a regenerated-or-chipped-then-abandoned session. Only `signal` separates them, and the
// proxy already does that separation for us. These two readers are the only place this page is
// allowed to source a 👍/👎 count from; nothing below may reach for ratings.up / ratings.down /
// bucket.down again.
//   explicitDown — a human pressed the thumb. This is what an "EXPLICIT 👎" tile means.
//   implicitDown — the draft was regenerated or chipped and then never sent. Real signal, and
//                  usually the larger number, but it is not a rejection someone declared.
// implicitDown at the TOP level arrived in proxy v7.53; derive it where the deployed proxy is
// older so this page is correct against v7.49+ either way. Per-bucket implicitDown is v7.51.
function explicitDownOf(d)  { return (d && d.explicitDown) || 0; }
function implicitDownOf(d)  {
  if (!d) return 0;
  if (typeof d.implicitDown === 'number') return d.implicitDown;
  const down = (d.ratings ? d.ratings.down : d.down) || 0;
  return Math.max(0, down - explicitDownOf(d));
}
function explicitUpOf(d)    { return (d && d.explicitUp) || 0; }
function implicitUpOf(d)    {
  if (!d) return 0;
  if (typeof d.implicitUp === 'number') return d.implicitUp;
  return (d.signals && d.signals.implicit_copy) || 0;
}

const STORE_COLORS = {
  'Community Honda Lafayette': '#38bdf8',
  'Community Honda Baytown':   '#34d399',
  'Community Toyota Baytown':  '#f87171',
  'Community Kia Baytown':     '#fb923c',
  'Audi Lafayette':            '#a78bfa',
  'unknown':                   '#374151',
};
const PERSONA_LABELS = {
  bdc: 'BDC Agent', sales: 'Sales', manager: 'Manager',
  internet_director: 'Int. Director', concierge: 'Concierge', unknown: 'Unknown',
};
const RANGES = [
  { label: 'Today',   days: 0 },
  { label: '7 days',  days: 6 },
  { label: '14 days', days: 13 },
  { label: '30 days', days: 29 },
];

// (Fixed — real bug: Gil caught the dashboard rolling over to "tomorrow" at
// 7:55 PM Central, hours before actual local midnight.) new Date() gets the
// right moment in time, but .toISOString() always converts to UTC before
// formatting — Central Daylight Time is UTC-5 in summer, so anything after
// ~7 PM Central was already "tomorrow" in UTC terms. Fixed the same way the
// Feedback Gatherer tool already does it correctly: format "now" directly
// in America/Chicago via Intl.DateTimeFormat, never round-tripping through
// UTC. en-CA locale gives YYYY-MM-DD formatting natively.
function centralToday(offsetDays) {
  const now = new Date(Date.now() - (offsetDays || 0) * 86400000);
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit' }).format(now);
}
function fmtDate(n) {
  return centralToday(n);
}
function posColor(r) { return r >= 90 ? '#34d399' : r >= 75 ? '#fbbf24' : '#f87171'; }

async function fetchRange(from, to) {
  const extTo = new Date(new Date(to).getTime() + 864e5).toISOString().slice(0,10);
  // (v1.1) key= appended — see DIRECTOR_KEY note above.
  const res = await fetch(`${PROXY}/feedback/range?from=${from}&to=${extTo}&key=${encodeURIComponent(DIRECTOR_KEY)}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ── Tooltip ──
function CT({ active, payload, label }) {
  if (!active || !payload?.length) return null;
  return h('div', { className: 'custom-tooltip' },
    h('div', { className: 'label' }, label),
    payload.map((p,i) => h('div', { key: i, style: { color: p.color || '#e2e8f0' } },
      `${p.name}: `, h('strong', null, p.value + (p.name === 'Pos %' ? '%' : ''))
    ))
  );
}

// ── Stat card ──
function Stat({ label, value, color, sub }) {
  return h('div', { className: 'stat' },
    h('div', { className: 'stat-label' }, label),
    h('div', { className: 'stat-value', style: { color: color || '#f0f9ff' } }, value),
    sub && h('div', { className: 'stat-sub' }, sub)
  );
}

// ── Store bar ──
function StoreBar({ name, data }) {
  const pos = (data.up||0) + (data.weak_up||0);
  const rate = data.total ? Math.round(100*pos/data.total) : 0;
  const color = STORE_COLORS[name] || '#60a5fa';
  const short = name.replace('Community ','').replace(' Lafayette',' Laf.').replace(' Baytown',' Bay.');
  // (v1.2) Two separate facts, never one blended count. An agent pressing 👎 is not the same
  // event as a draft being regenerated and left unsent, and on 8/15 this row showed 16 for Honda
  // Lafayette when the true explicit count for the entire day, every store, was zero.
  const exDown = explicitDownOf(data);
  const imDown = implicitDownOf(data);
  return h('div', { className: 'store-row' },
    h('div', { className: 'store-meta' },
      h('div', { className: 'store-name' }, short),
      h('div', { className: 'store-stats' },
        h('span', { className: 'store-signals' }, data.total + ' sig'),
        h('span', { className: 'store-rate', style: { color: posColor(rate) } }, rate + '%'),
        exDown > 0 && h('span', { className: 'store-down', title: 'Explicit thumbs-down' }, '👎 ' + exDown),
        imDown > 0 && h('span', { className: 'store-nocopy', title: 'Regenerated or chipped, then left unsent — not an explicit rejection' }, 'no-copy ' + imDown)
      )
    ),
    h('div', { className: 'bar-bg' },
      h('div', { className: 'bar-fill', style: { width: rate + '%', background: color } })
    )
  );
}

// ── Main ──
function App() {
  const [ri, setRi] = useState(1);
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [showAll, setShowAll] = useState(false);
  const [ts, setTs] = useState(null);

  const load = useCallback(async (idx) => {
    setLoading(true); setError(null);
    try {
      const from = fmtDate(RANGES[idx].days);
      const to   = fmtDate(0);
      const d = await fetchRange(from, to);
      setData(d); setTs(new Date());
    } catch(e) { setError(e.message); }
    finally { setLoading(false); }
  }, []);

  useEffect(() => { load(ri); }, [ri]);

  const trend = data ? Object.entries(data.byDay||{})
    .filter(([,d]) => d.total > 0)
    .sort(([a],[b]) => a.localeCompare(b))
    .map(([date,d]) => ({ date: date.slice(5), 'Pos %': d.posRate, 'Signals': d.total,
                          'Explicit 👎': explicitDownOf(d), 'No-copy': implicitDownOf(d) }))
    : [];

  const stores = data ? Object.entries(data.byStore||{})
    .filter(([n]) => n !== 'unknown')
    .sort((a,b) => b[1].total - a[1].total) : [];

  const personas = data ? Object.entries(data.byPersona||{})
    .filter(([n]) => n !== 'unknown')
    .sort((a,b) => b[1].total - a[1].total) : [];

  const sources = data ? Object.entries(data.byLeadSource||{})
    .filter(([,d]) => d.total >= 2)
    .sort((a,b) => b[1].total - a[1].total) : [];
  const visSrc = showAll ? sources : sources.slice(0,12);

  const flags = data ? Object.entries(data.byFlag||{})
    .filter(([,d]) => d.total >= 2)
    .sort((a,b) => b[1].total - a[1].total) : [];

  const total = data?.total || 0;
  const posRate = data?.posRate || 0;
  // (v1.2) These were `data.ratings.up` and `data.ratings.down` — the blended fields. Under a tile
  // labelled EXPLICIT that overstated 👍 by the entire implicit-copy count and 👎 by every
  // regenerated-then-abandoned session. 8/15: 156 shown for 0 real thumbs-up, 27 for 0 real
  // thumbs-down.
  const explicitUp   = explicitUpOf(data);
  const explicitDown = explicitDownOf(data);
  const implicitUp   = implicitUpOf(data);
  const implicitDown = implicitDownOf(data);

  return h('div', { className: 'wrap' },

    // Header
    h('div', { className: 'header fade-up' },
      h('div', null,
        h('div', { className: 'logo-line' }, 'Community Auto Group'),
        h('div', { className: 'logo' }, 'LeadPro ', h('span', null, 'Dashboard')),
        h('div', { className: 'sub' }, 'Response Quality · Live KV Data')
      ),
      h('div', null,
        h('div', { className: 'range-btns' },
          RANGES.map((r,i) => h('button', {
            key: i, onClick: () => setRi(i),
            className: 'range-btn' + (ri === i ? ' active' : ''),
          }, r.label)),
          h('button', { className: 'refresh-btn', onClick: () => load(ri) }, '↻')
        ),
        ts && h('div', { className: 'refresh-time' }, 'Updated ' + ts.toLocaleTimeString())
      )
    ),

    loading && h('div', { style: { textAlign:'center', padding:60, color:'#4b5563', fontSize:13 }, className:'loading-pulse' }, 'Loading feedback data…'),
    error && h('div', { className: 'error-box' }, 'Error: ' + error),

    data && !loading && h(Fragment, null,

      // Stats row 1
      h('div', { className: 'stats-grid fade-up fade-up-1' },
        h(Stat, { label:'Total Signals', value: total.toLocaleString() }),
        h(Stat, { label:'Positive Rate', value: posRate+'%', color: posColor(posRate) }),
        h(Stat, { label:'Explicit 👍', value: explicitUp.toLocaleString(), color:'#34d399',
          sub: implicitUp.toLocaleString()+' implicit copy' }),
        h(Stat, { label:'Explicit 👎', value: explicitDown,
          color: explicitDown > 5 ? '#f87171' : '#94a3b8',
          sub: implicitDown.toLocaleString()+' regenerated / chipped, unsent' })
      ),

      // (v1.2) Say plainly what the two tiles above do and do not count, so the numbers are not
      // read as "nobody liked anything today".
      h('div', { className: 'disclosure fade-up fade-up-1' },
        '👍/👎 above are explicit thumb clicks only. Implicit: ',
        h('strong', null, implicitUp.toLocaleString()), ' copied as-is, ',
        h('strong', null, implicitDown.toLocaleString()), ' regenerated or chipped then left unsent.',
        (total ? ' Explicit rejection rate: ' + Math.round(100*explicitDown/total) + '%.' : '')
      ),

      // Stats row 2
      h('div', { className: 'stats-grid fade-up fade-up-2', style:{marginBottom:20} },
        h(Stat, { label:'Avg Regens/Session', value: data.avgRegens,
          color: data.avgRegens > 0.3 ? '#fbbf24' : '#94a3b8' }),
        h(Stat, { label:'Regen → Copy', value: data.signals?.implicit_regen_copy||0, sub:'regen helped' }),
        h(Stat, { label:'Date Range', value: (data.from||'').slice(5)+' →', sub: (data.to||'').slice(5) }),
        h(Stat, { label:'Days w/ Data', value: trend.length, sub: 'of '+(data.dates?.length||0)+' days' })
      ),

      // Trend line
      chartsAvailable && trend.length > 1 && h('div', { className: 'card fade-up fade-up-3', style:{marginBottom:12} },
        h('div', { className: 'section-title' }, 'Positive Rate Trend'),
        h(ResponsiveContainer, { width:'100%', height:155 },
          h(LineChart, { data: trend, margin:{top:4,right:4,left:-22,bottom:0} },
            h(XAxis, { dataKey:'date', tick:{fontSize:10,fill:'#6b7280'}, axisLine:false, tickLine:false }),
            h(YAxis, { domain:[50,100], tick:{fontSize:10,fill:'#6b7280'}, axisLine:false, tickLine:false }),
            h(Tooltip, { content: h(CT) }),
            h(Line, { type:'monotone', dataKey:'Pos %', stroke:'#3b82f6', strokeWidth:2.5,
              dot:{r:3,fill:'#3b82f6',strokeWidth:0}, name:'Pos %' })
          )
        )
      ),

      // Volume bar chart
      chartsAvailable && trend.length > 1 && h('div', { className: 'card fade-up fade-up-3', style:{marginBottom:20} },
        h('div', { className: 'section-title' }, 'Daily Signal Volume'),
        h(ResponsiveContainer, { width:'100%', height:110 },
          h(BarChart, { data: trend, margin:{top:4,right:4,left:-22,bottom:0} },
            h(XAxis, { dataKey:'date', tick:{fontSize:10,fill:'#6b7280'}, axisLine:false, tickLine:false }),
            h(YAxis, { tick:{fontSize:10,fill:'#6b7280'}, axisLine:false, tickLine:false }),
            h(Tooltip, { content: h(CT) }),
            h(Bar, { dataKey:'Signals', radius:[3,3,0,0] },
              trend.map((e,i) => h(Cell, { key:i,
                fill: e['Pos %'] >= 85 ? '#1d4ed8' : e['Pos %'] >= 70 ? '#92400e' : '#7f1d1d' }))
            )
          )
        )
      ),

      // Store + Persona
      h('div', { className: 'two-col fade-up fade-up-4', style:{marginBottom:12} },

        h('div', { className: 'card' },
          h('div', { className: 'section-title' }, 'By Store'),
          stores.map(([name,d]) => h(StoreBar, { key:name, name, data:d }))
        ),

        h('div', { className: 'card' },
          h('div', { className: 'section-title' }, 'By Persona'),
          h('table', { className: 'tbl' },
            h('thead', null, h('tr', null,
              h('th', null, 'Persona'),
              h('th', { className:'right' }, 'Signals'),
              h('th', { className:'right' }, 'Pos Rate'),
              h('th', { className:'right' }, 'Expl. 👎'),
              h('th', { className:'right' }, 'No-Copy')
            )),
            h('tbody', null, personas.map(([name,d]) => {
              const pos = (d.up||0)+(d.weak_up||0);
              const rate = d.total ? Math.round(100*pos/d.total) : 0;
              const ex = explicitDownOf(d), im = implicitDownOf(d);
              return h('tr', { key:name },
                h('td', null, PERSONA_LABELS[name]||name),
                h('td', { className:'right mono', style:{color:'#94a3b8'} }, d.total),
                h('td', { className:'right mono', style:{color:posColor(rate),fontWeight:600} }, rate+'%'),
                h('td', { className:'right', style:{color: ex > 0 ? '#f87171' : '#4b5563'} }, ex > 0 ? '👎 '+ex : '—'),
                h('td', { className:'right mono', style:{color: im > 0 ? '#fbbf24' : '#4b5563'} }, im > 0 ? im : '—')
              );
            }))
          )
        )
      ),

      // Lead Sources
      h('div', { className: 'card fade-up fade-up-5', style:{marginBottom:12} },
        h('div', { className: 'section-title' }, 'By Lead Source (≥2 signals)'),
        h('table', { className: 'tbl' },
          h('thead', null, h('tr', null,
            h('th', null, 'Source'),
            h('th', { className:'right' }, 'Signals'),
            h('th', { className:'right' }, 'Pos Rate'),
            h('th', { className:'right' }, 'Expl. 👎'),
            h('th', { className:'right' }, 'No-Copy')
          )),
          h('tbody', null, visSrc.map(([name,d]) => {
            const rate = d.total ? Math.round(100*d.up/d.total) : 0;
            const short = name.length > 42 ? name.slice(0,40)+'…' : name;
            const ex = explicitDownOf(d), im = implicitDownOf(d);
            return h('tr', { key:name },
              h('td', null, short),
              h('td', { className:'right mono', style:{color:'#94a3b8'} }, d.total),
              h('td', { className:'right mono', style:{color:posColor(rate),fontWeight:600} }, rate+'%'),
              h('td', { className:'right', style:{color: ex > 0 ? '#f87171' : '#4b5563'} }, ex > 0 ? ex : '—'),
              h('td', { className:'right mono', style:{color: im > 0 ? '#fbbf24' : '#4b5563'} }, im > 0 ? im : '—')
            );
          }))
        ),
        sources.length > 12 && h('button', { className:'show-more', onClick:()=>setShowAll(v=>!v) },
          showAll ? 'Show less' : 'Show all '+sources.length+' sources'
        )
      ),

      // Context Flags
      flags.length > 0 && h('div', { className: 'card fade-up fade-up-5', style:{marginBottom:12} },
        h('div', { className: 'section-title' }, 'By Context Flag'),
        h('div', { className: 'flag-grid' },
          flags.map(([flag,d]) => {
            const rate = d.total ? Math.round(100*d.up/d.total) : 0;
            const ex = explicitDownOf(d), im = implicitDownOf(d);
            return h('div', { key:flag, className:'flag-chip' },
              h('div', { className:'flag-name' }, flag),
              h('div', { className:'flag-rate', style:{color:posColor(rate)} }, rate+'%'),
              h('div', { className:'flag-meta' }, d.total+' signals · 👎'+ex+' · '+im+' no-copy')
            );
          })
        )
      ),

      h('div', { style:{textAlign:'center',fontSize:10,color:'#374151',paddingTop:8,fontFamily:'IBM Plex Mono,monospace'} },
        'LeadPro · Community Auto Group · Data via leadpro-proxy KV'
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
